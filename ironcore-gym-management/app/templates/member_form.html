{% extends "base.html" %}
{% block title %}Edit member{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">PEOPLE / PROFILE</p><h1>Edit member<span class="accent">.</span></h1><p class="subheading">Update this member's contact details and status.</p></div><a class="btn btn-secondary" href="{{ url_for('main.members') }}">← Back to members</a></div>
<section class="panel form-panel"><form method="post" class="form-grid">
<label>Full name <input name="full_name" required maxlength="100" value="{{ member.full_name }}"></label>
<label>Email address <input name="email" type="email" required maxlength="150" value="{{ member.email }}"></label>
<label>Phone number <input name="phone" type="tel" maxlength="25" value="{{ member.phone or '' }}"></label>
<label>Gender <select name="gender"><option value="">Select gender</option>{% for g in ['Female','Male','Non-binary','Prefer not to say'] %}<option {{ 'selected' if member.gender == g else '' }}>{{ g }}</option>{% endfor %}</select></label>
<label>Status <select name="status"><option {{ 'selected' if member.status == 'Active' else '' }}>Active</option><option {{ 'selected' if member.status == 'Inactive' else '' }}>Inactive</option></select></label>
<div class="form-actions"><button class="btn btn-primary" type="submit">Save changes ↗</button></div>
</form></section>
{% endblock %}
